[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daso-det"
version = "0.1.0"
description = "DASO-Det and the MSOCD-160K SAR-optical object-level change detection benchmark"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
dependencies = [
    "torch>=1.13,!=2.4.0", "torchvision>=0.14", "numpy>=1.23,<2",
    "opencv-python>=4.6,<4.12", "matplotlib>=3.3", "pillow>=9",
    "pyyaml>=6", "requests>=2.23", "scipy>=1.8", "tqdm>=4.64",
    "psutil", "py-cpuinfo", "pandas>=1.4", "seaborn>=0.11",
    "ultralytics-thop>=2.0",
]

[project.urls]
Repository = "https://github.com/meng0505/MSOCD-160K"

[tool.setuptools.packages.find]
include = ["ultralytics", "ultralytics.*"]

[tool.setuptools.package-data]
ultralytics = ["cfg/default.yaml", "cfg/models/*.yaml", "cfg/solutions/default.yaml"]
